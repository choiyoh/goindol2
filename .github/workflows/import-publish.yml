name: import-publish
on:
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Materialize staged files
        run: |
          python3 <<'PY'
          import json, base64, os, glob
          parts = {}
          for path in sorted(glob.glob("_staging/*.json")):
            m = json.load(open(path))
            if "__part__" in m:
              name = m["__part__"]
              parts.setdefault(name, {"n": m["n"], "chunks": {}})
              parts[name]["chunks"][m["i"]] = m["data"]
              continue
            for rel, b64 in m.items():
              if rel.startswith("__"):
                continue
              os.makedirs(os.path.dirname(rel) or ".", exist_ok=True)
              data = base64.b64decode(b64)
              open(rel, "wb").write(data)
              print(rel, len(data))
          for name, info in parts.items():
            data_b64 = "".join(info["chunks"][i] for i in range(info["n"]))
            data = base64.b64decode(data_b64)
            os.makedirs(os.path.dirname(name) or ".", exist_ok=True)
            open(name, "wb").write(data)
            print(name, len(data), "(from parts)")
          PY
      - name: Commit publish tree and remove staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf _staging
          git rm -rf --ignore-unmatch _staging probe.txt .github/workflows/import-pngs.yml || true
          git add -A
          git status
          git commit -m "Materialize full goindol2 publish tree" || echo "nothing"
          git push
